<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мессенджер Telegram Style</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://pusher.com"></script>
</head>
<body>
    <div class="messenger-container">
        <div class="sidebar">
            <div class="sidebar-header">
                <div style="display:flex;align-items:center;gap:10px;">
                    <img id="my-avatar" src="" style="width:34px;height:34px;border-radius:50%;object-fit:cover;display:none;">
                    <span id="user-display">Вы:...</span>
                </div>
                <a href="/logout" class="logout-btn">Выйти</a>
            </div>
            <ul id="users-list"></ul>
        </div>
        <div class="chat-area">
            <!-- ИСПРАВЛЕНО: Добавлен контейнер для кнопок звонка справа -->
            <div class="chat-header" style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
                <div id="chat-header-title">Выберите чат или собеседника слева</div>
                <div id="call-buttons-container" style="display: none; gap: 15px; margin-right: 10px;">
                    <button type="button" id="start-audio-call" style="background:none; border:none; font-size:20px; cursor:pointer; color:#3390ec;" title="Голосовой звонок">📞</button>
                    <button type="button" id="start-video-call" style="background:none; border:none; font-size:20px; cursor:pointer; color:#3390ec;" title="Видеозвонок">📹</button>
                </div>
            </div>
            <ul id="messages"></ul>
            <form id="form" action="" style="display:none;position:relative;">
                <button type="button" id="emoji-btn" style="background:none;color:#3390ec;margin:05px;padding:0;width:auto;cursor:pointer;font-size:22px;border:none;outline:none;">😊</button>
                <button type="button" id="video-note-btn" style="background:none;color:#3390ec;margin:05px;padding:0;width:auto;cursor:pointer;font-size:22px;border:none;outline:none;">📹</button>
                <input id="input" autocomplete="off" placeholder="Написать сообщение..."/>
                <button type="submit">Отправить</button>
                <div id="emoji-picker" style="display:none;position:absolute;bottom:70px;left:20px;background:#ffffff;border:1pxsolid#e4e4e7;border-radius:12px;box-shadow:05px20pxrgba(0,0,0,0.15);width:340px;height:280px;overflow-y:auto;padding:12px;z-index:1000;box-sizing:border-box;">
                    <div style="font-size:12px;color:#a1a1aa;margin-bottom:8px;font-weight:bold;text-align:left;">Ваши эмодзи и мемы</div>
                    <div class="emoji-list" id="custom-emojis-container"></div>
                </div>
            </form>
        </div>
    </div>

    <!-- ДОБАВЛЕНО: Интерфейс WebRTC звонка (перекрывает экран при вызове) -->
    <div id="call-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 2000; flex-direction: column; align-items: center; justify-content: center; color: white; font-family: sans-serif;">
        <div id="call-status" style="font-size: 20px; margin-bottom: 10px; font-weight: bold;">Звонок...</div>
        <div id="call-user" style="font-size: 16px; margin-bottom: 30px; color: #a1a1aa;">Собеседник</div>
        
        <div id="video-container" style="display: none; gap: 20px; margin-bottom: 30px; width: 100%; max-width: 800px; justify-content: center; flex-wrap: wrap;">
            <div style="position: relative; width: 320px; height: 240px; background: #27272a; border-radius: 12px; overflow: hidden;">
                <video id="local-video" autoplay muted playsinline style="width: 100%; height: 100%; object-fit: cover;"></video>
                <span style="position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.5); padding: 2px 8px; border-radius: 4px; font-size: 12px;">Вы</span>
            </div>
            <div style="position: relative; width: 320px; height: 240px; background: #27272a; border-radius: 12px; overflow: hidden;">
                <video id="remote-video" autoplay playsinline style="width: 100%; height: 100%; object-fit: cover;"></video>
                <span id="remote-video-label" style="position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.5); padding: 2px 8px; border-radius: 4px; font-size: 12px;">Собеседник</span>
            </div>
        </div>

        <div style="display: flex; gap: 20px;">
            <button type="button" id="accept-call-btn" style="display: none; background: #22c55e; color: white; border: none; padding: 12px 24px; border-radius: 24px; font-size: 16px; cursor: pointer; font-weight: bold;">Ответить</button>
            <button type="button" id="hangup-call-btn" style="background: #ef4444; color: white; border: none; padding: 12px 24px; border-radius: 24px; font-size: 16px; cursor: pointer; font-weight: bold;">Сбросить</button>
        </div>
    </div>

<script type="module">

let localStream = null;
let peerConnection = null;
let currentCallWithUser = null;

const rtcConfig = {
    iceServers: [
        { urls: 'stun:google.com' },
        { urls: 'stun:google.com' }
    ]
};

    let currentUserId = null;
    let currentUsername = '';
    let currentUserRole = '';
    let activeChatUser = null;      
    let activeChatUsername = '';  
    let customEmojisList = [];
    

    function convertCustomEmojis(text) {
        let result = text;
        if (!customEmojisList || customEmojisList.length === 0) return result;
        customEmojisList.forEach(fileName => {
            const shortcode = `:${fileName}:`;
            if (result.includes(shortcode)) {
                const imgTag = `<img src="emojis/${fileName}" style="width:24px;height:24px;display:inline-block;vertical-align:-5px;margin:0 2px;object-fit:contain;">`;
                result = result.split(shortcode).join(imgTag);
            }
        });
        return result;
    }

    async function checkAuth() {
        try {
            const response = await fetch('/api/check-auth');
            const data = await response.json();

            if (!data.authorized) {
                window.location.href = 'login.html';
                return;
            }

            currentUserId = data.user.id;
            currentUsername = data.user.username;
            currentUserRole = data.user.role;

            document.getElementById('user-display').textContent = currentUsername;
            
            const myAvatar = document.getElementById('my-avatar');
            if (data.user.avatar) {
                myAvatar.src = data.user.avatar;
                myAvatar.style.display = 'block';
            }

            const emojisResponse = await fetch('/api/emojis');
            if (emojisResponse.ok) {
                customEmojisList = await emojisResponse.json();
            } else {
                customEmojisList = [];
            }

            initMessenger();
			

        } catch (err) {
            console.error(err);
            window.location.href = 'login.html';
        }
    }


    checkAuth();

    function initMessenger() {
        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const messages = document.getElementById('messages');
        const usersList = document.getElementById('users-list');
        const chatHeaderTitle = document.getElementById('chat-header-title');
        const emojiBtn = document.getElementById('emoji-btn');
        const emojiPicker = document.getElementById('emoji-picker');
        const customEmojisContainer = document.getElementById('custom-emojis-container');
        const videoNoteBtn = document.getElementById('video-note-btn');

        let mediaRecorder = null;
        let recordedChunks = [];
        let isRecording = false;
        let streamRef = null;

        videoNoteBtn.addEventListener('click', async () => {
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { width: 400, height: 400, facingMode: "user" }, 
                        audio: true 
                    });
                    streamRef = stream;
                    recordedChunks = [];
                    
                    mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                    mediaRecorder.ondataavailable = (e) => {
                        if (e.data.size > 0) recordedChunks.push(e.data);
                    };

                    mediaRecorder.onstop = async () => {
                        const blob = new Blob(recordedChunks, { type: 'video/webm' });
                        const reader = new FileReader();
                        reader.readAsDataURL(blob);
                        reader.onloadend = async () => {
                            const base64String = reader.result;
                            const uploadResponse = await fetch('/api/upload-video', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ videoBase64: base64String })
                            });
                            if (uploadResponse.ok) {
                                const uploadData = await uploadResponse.json();
                                await sendMessage(`[VIDEO_NOTE:${uploadData.videoUrl}]`);
                            }
                        };
                        
                        streamRef.getTracks().forEach(track => track.stop());
                    };

                    mediaRecorder.start();
                    isRecording = true;
                    videoNoteBtn.style.color = '#ef5350';
                    videoNoteBtn.textContent = '🛑';
                } catch (err) {
                    alert('Не удалось получить доступ к камере или микрофону');
                }
            } else {
                if (mediaRecorder && mediaRecorder.state !== 'inactive') {
                    mediaRecorder.stop();
                }
                isRecording = false;
                videoNoteBtn.style.color = '#3390ec';
                videoNoteBtn.textContent = '📹';
            }
        });

        document.querySelector('.logout-btn').addEventListener('click', async (e) => {

            e.preventDefault();
            localStorage.clear();
            window.location.href = 'login.html';
        });

        customEmojisContainer.innerHTML = '';
        if (!customEmojisList || customEmojisList.length === 0) {
            customEmojisContainer.innerHTML = '<div style="font-size:12px;color:#a1a1aa;width:100%;text-align:left;">Папка emojis пуста.</div>';
        } else {
            customEmojisContainer.style.display = 'grid';
            customEmojisContainer.style.gridTemplateColumns = 'repeat(auto-fill, minmax(60px, 1fr))';
            customEmojisContainer.style.gap = '10px';
            customEmojisContainer.style.width = '100%';
            
            customEmojisList.forEach(fileName => {
                const img = document.createElement('img');
                img.src = `emojis/${fileName}`;
                img.style.setProperty('width', '60px', 'important');
                img.style.setProperty('height', '60px', 'important');
                img.style.cursor = 'pointer';
                img.style.objectFit = 'contain';
                img.style.borderRadius = '6px';
                img.style.transition = 'transform 0.15s ease';
                img.title = fileName;
                
                img.addEventListener('mouseenter', () => img.style.setProperty('transform', 'scale(1.1)', 'important'));
                img.addEventListener('mouseleave', () => img.style.setProperty('transform', 'scale(1.0)', 'important'));
                
                img.addEventListener('click', () => {
                    sendMessage(`:${fileName}:`);
                    emojiPicker.style.display = 'none';
                });
                customEmojisContainer.appendChild(img);
            });
        }

        emojiBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            emojiPicker.style.display = emojiPicker.style.display === 'none' ? 'block' : 'none';
        });
        document.addEventListener('click', () => { emojiPicker.style.display = 'none'; });
        emojiPicker.addEventListener('click', (e) => { e.stopPropagation(); });

        async function loadUsers() {
            try {
                const response = await fetch('/api/get-users');
                if (!response.ok) return;
                const users = await response.json();

                usersList.innerHTML = '';
                users.forEach(user => {
                    if (user.username === currentUsername) return;

                    const li = document.createElement('li');
                    
                    const img = document.createElement('img');
                    img.src = user.avatar || '/user-avatar-default.jpg';
                    img.classList.add('user-avatar-modern');
                    
                    const nameSpan = document.createElement('span');
                    nameSpan.textContent = user.username;
                    nameSpan.style.fontSize = '15px';
                    nameSpan.style.fontWeight = '500';
                    
                    li.appendChild(img);
                    li.appendChild(nameSpan);

                    if (activeChatUser === user.username) li.classList.add('active');

const openChat = () => {
    activeChatUser = user.username;
    activeChatUsername = user.username;
    document.querySelectorAll('#users-list li').forEach(el => el.classList.remove('active'));
    li.classList.add('active');
    
    chatHeaderTitle.innerHTML = `
        <div style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <button type="button" class="back-to-list-btn" style="background: none; border: none; font-size: 20px; cursor: pointer; color: #3390ec;">←</button>
                <img src="${user.avatar || '/user-avatar-default.png'}" class="chat-header-avatar" style="width: 34px; height: 34px; border-radius: 50%; object-fit: cover;">
                <span style="font-size: 16px;"><strong>${activeChatUsername}</strong></span>
            </div>
            <div style="display: flex; gap: 15px; margin-right: 15px;">
                <button type="button" id="start-audio-call" style="background: none; border: none; font-size: 20px; cursor: pointer; color: #3390ec;" title="Голосовой звонок">📞</button>
                <button type="button" id="start-video-call" style="background: none; border: none; font-size: 20px; cursor: pointer; color: #3390ec;" title="Видеозвонок">📹</button>
            </div>
        </div>`;

    // ОБЯЗАТЕЛЬНО: Сразу после innerHTML вешаем события вызова на эти новые кнопки
    document.getElementById('start-audio-call').onclick = () => startCall(false);
    document.getElementById('start-video-call').onclick = () => startCall(true);

    const sidebar = document.querySelector('.sidebar');
    sidebar.classList.add('hide-mobile');

    const backBtn = chatHeaderTitle.querySelector('.back-to-list-btn');
    if (backBtn) {
        backBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            sidebar.classList.remove('hide-mobile');
        });
        backBtn.addEventListener('touchstart', (e) => {
            e.stopPropagation();
            sidebar.classList.remove('hide-mobile');
        });
    }

    form.setAttribute('style', 'display: flex !important; position: relative;');
    loadChatHistory();
};


                    li.addEventListener('click', openChat);
                    li.addEventListener('touchstart', (e) => {
                        e.preventDefault();
                        openChat();
                    });

                    usersList.appendChild(li);
                });
            } catch (err) {
                console.error(err);
            }
        }
        loadUsers();

        async function loadChatHistory() {
            messages.innerHTML = '';
            try {
                const response = await fetch('/api/messages');
                if (response.ok) {
                    const chatData = await response.json();
                    chatData.forEach(appendMessage);
                }
            } catch (err) {
                console.error(err);
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = input.value.trim();
            if (!text) return;
            
            input.value = '';
            await sendMessage(text);
        });


        async function sendMessage(text) {
            try {
                const response = await fetch('/api/send-message', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ text: text })
                });
                if (!response.ok) {
                    console.error('Ошибка отправки');
                }
            } catch (err) {
                console.error(err);
            }
        }

        const createDeleteButton = (messageId) => {
            const delBtn = document.createElement('button');
            delBtn.classList.add('delete-msg-btn');
            delBtn.addEventListener('click', async () => {
                if (confirm('Вы уверены, что хотите удалить это сообщение?')) {
                    try {
                        const response = await fetch('/api/delete-message', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ msgId: messageId })
                        });
                        if (!response.ok) {
                            const errorData = await response.json();
                            alert('Ошибка при удалении: ' + errorData.message);
                        }
                    } catch (err) {
                        console.error(err);
                    }
                }
            });
            return delBtn;
        };

        function appendMessage(data) {
            const item = document.createElement('li');
            item.id = `msg-${data.id}`;
            
            if (data.username === currentUsername) {
                item.classList.add('my-msg');
            }

            const date = data.timestamp ? new Date(data.timestamp) : new Date();
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            const timeString = `${hours}:${minutes}`;
            const trimmedText = String(data.text).trim();
            
            const isSingleEmoji = /^:[^:]+:$/.test(trimmedText);
            
            if (isSingleEmoji) {
                const fileName = trimmedText.replace(/:/g, '');
                if (customEmojisList.includes(fileName)) {
                    item.style.background = 'none';
                    item.style.boxShadow = 'none';
                    item.style.border = 'none';
                    item.style.padding = '0';
                    item.style.position = 'relative';
                    item.innerHTML = `
                        <div style="position:relative; display:inline-block;">
                            <img src="emojis/${fileName}" style="width:200px; height:auto; border-radius:12px; display:block; object-fit:contain;">
                            <span style="position:absolute; bottom:8px; right:10px; background:rgba(0,0,0,0.5); color:white; padding:2px 6px; border-radius:10px; font-size:11px; user-select:none;">${timeString}</span>
                        </div>
                    `;
                    
                    if (currentUserRole === 'admin') {
                        const btn = createDeleteButton(data.id);
                        btn.textContent = 'Удалить мем';
                        btn.style.display = 'block';
                        btn.style.marginTop = '5px';
                        item.appendChild(btn);
                    }
                    
                    messages.appendChild(item);
                    messages.scrollTop = messages.scrollHeight;
                    return; 
                }
            }

            const isVideoNote = /^\[VIDEO_NOTE:(.+)\]$/.test(trimmedText);

            if (isVideoNote) {
                const match = trimmedText.match(/^\[VIDEO_NOTE:(.+)\]$/);
                const videoUrl = match ? match[1] : '';
                
                item.style.background = 'none';
                item.style.boxShadow = 'none';
                item.style.border = 'none';
                item.style.padding = '0';
                item.style.position = 'relative';
                item.innerHTML = `
                    <div style="position:relative; display:inline-block; width:200px; height:200px; border-radius:50%; overflow:hidden; border:2px solid #3390ec; background:#000; cursor:pointer;">
                        <video src="${videoUrl}" autoplay loop playsinline style="width:100%; height:100%; object-fit:cover; border-radius:50%;"></video>
                        <div class="play-overlay" style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.3); justify-content:center; align-items:center; color:white; font-size:40px; z-index:5;">⏸</div>
                        <span style="position:absolute; bottom:8px; right:10px; background:rgba(0,0,0,0.5); color:white; padding:2px 6px; border-radius:10px; font-size:11px; user-select:none; z-index:10;">${timeString}</span>
                    </div>
                `;
                
                const videoEl = item.querySelector('video');
                const overlay = item.querySelector('.play-overlay');
                
                videoEl.parentElement.addEventListener('click', () => {
                    if (videoEl.paused) {
                        videoEl.play();
                        overlay.style.display = 'none';
                    } else {
                        videoEl.pause();
                        overlay.style.display = 'flex';
                    }
                });
                
                if (currentUserRole === 'admin') {
                    const btn = createDeleteButton(data.id);
                    btn.textContent = 'Удалить кружочек';
                    btn.style.display = 'block';
                    btn.style.marginTop = '5px';
                    item.appendChild(btn);
                }
                
                messages.appendChild(item);
                messages.scrollTop = messages.scrollHeight;
                return;
            }



            const processedText = convertCustomEmojis(trimmedText);
            
            item.innerHTML = `
                <strong>${data.username}</strong>
                <div style="display: flex; flex-direction: column; gap: 2px;">
                    <span>${processedText}</span>
                    <span style="font-size: 10px; color: #a1a1aa; align-self: flex-end; margin-top: 2px; user-select: none;">${timeString}</span>
                </div>
            `;
            
            if (currentUserRole === 'admin') {
                const btn = createDeleteButton(data.id);
                btn.textContent = '✖';
                item.appendChild(btn);
            }

            messages.appendChild(item);
            messages.scrollTop = messages.scrollHeight;
        }

 const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
const socket = new WebSocket(`${protocol}//${window.location.host}`);

// ДОБАВЬ ЭТОТ БЛОК: как только сокет открылся, сразу шлем серверу свой ник
socket.onopen = function() {
    if (currentUsername) {
        socket.send(JSON.stringify({
            type: 'register-username',
            username: currentUsername
        }));
    }
};

        socket.onmessage = function(event) {
            const payload = JSON.parse(event.data);
            
            // --- 1. Обработка текстовых сообщений и стикеров ---
            if (payload.type === 'new-message') {
                appendMessage(payload.data);
            } 
            
            // --- 2. Обработка удаления сообщений администратором ---
            else if (payload.type === 'message-deleted') {
                const msgElement = document.getElementById(`msg-${payload.id}`);
                if (msgElement) {
                    msgElement.style.opacity = '0.3';
                    msgElement.innerHTML = '<em>Сообщение удалено администратором</em>';
                }
            }
            
            // --- 3. Сигналы WebRTC звонков: Получение входящего вызова ---
            else if (payload.type === 'call-offer') {
                if (currentCallWithUser) { 
                    sendSignal('call-hangup', payload.sender); 
                    return; 
                }
                currentCallWithUser = payload.sender;
                document.getElementById('call-user').textContent = currentCallWithUser;
                document.getElementById('call-status').textContent = payload.isVideo ? "Входящий видеозвонок..." : "Входящий аудиозвонок...";
                document.getElementById('video-container').style.display = payload.isVideo ? "flex" : "none";
                document.getElementById('accept-call-btn').style.display = "inline-block";
                document.getElementById('call-overlay').style.display = "flex";

                // Логика нажатия кнопки «Ответить»
                document.getElementById('accept-call-btn').onclick = async () => {
                    document.getElementById('accept-call-btn').style.display = "none";
                    document.getElementById('call-status').textContent = "Соединение...";
                    try {
                        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: payload.isVideo });
                        document.getElementById('local-video').srcObject = localStream;
                        initPeerConnection(payload.isVideo);
                        await peerConnection.setRemoteDescription(new RTCSessionDescription(payload.offer));
                        const answer = await peerConnection.createAnswer();
                        await peerConnection.setLocalDescription(answer);
                        sendSignal('call-answer', currentCallWithUser, { answer: answer });
                        document.getElementById('call-status').textContent = "В разговоре";
                    } catch (err) { 
                        console.error(err); 
                        endCall(); 
                    }
                };
            } 
            
            // --- 4. Сигналы WebRTC звонков: Собеседник принял наш вызов ---
            else if (payload.type === 'call-answer') {
                if (peerConnection) {
                    peerConnection.setRemoteDescription(new RTCSessionDescription(payload.answer));
                    document.getElementById('call-status').textContent = "В разговоре";
                }
            } 
            
            // --- 5. Сигналы WebRTC звонков: Синхронизация сетевых путей (ICE) ---
            else if (payload.type === 'ice-candidate') {
                if (peerConnection && payload.candidate) {
                    peerConnection.addIceCandidate(new RTCIceCandidate(payload.candidate))
                        .catch(e => console.error(e));
                }
            } 
            
            // --- 6. Сигналы WebRTC звонков: Собеседник повесил трубку ---
            else if (payload.type === 'call-hangup') {
                if (peerConnection) peerConnection.close();
                if (localStream) localStream.getTracks().forEach(track => track.stop());
                peerConnection = null; 
                localStream = null;
                document.getElementById('local-video').srcObject = null;
                document.getElementById('remote-video').srcObject = null;
                document.getElementById('call-overlay').style.display = "none";
                currentCallWithUser = null;
                alert("Звонок завершен собеседником");
            }
        }; // Конец функции socket.onmessage

            
        setInterval(loadUsers, 10000);
		        async function startCall(isVideo = false) {
            if (!activeChatUser) return;
            currentCallWithUser = activeChatUser;
            document.getElementById('call-user').textContent = currentCallWithUser;
            document.getElementById('call-status').textContent = "Исходящий вызов...";
            document.getElementById('accept-call-btn').style.display = "none";
            document.getElementById('call-overlay').style.display = "flex";
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: isVideo });
                document.getElementById('local-video').srcObject = localStream;
                document.getElementById('video-container').style.display = isVideo ? "flex" : "none";
                initPeerConnection(isVideo);
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                sendSignal('call-offer', currentCallWithUser, { offer: offer, isVideo: isVideo });
            } catch (err) {
                console.error(err);
                alert("Не удалось получить доступ к камере или микрофону");
                endCall();
            }
        }

        function initPeerConnection(isVideo) {
            peerConnection = new RTCPeerConnection(rtcConfig);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) sendSignal('ice-candidate', currentCallWithUser, { candidate: event.candidate });
            };
            peerConnection.ontrack = (event) => {
                document.getElementById('remote-video').srcObject = event.streams;
                document.getElementById('remote-video-label').textContent = currentCallWithUser;
            };
        }

        function endCall() {
            if (currentCallWithUser) sendSignal('call-hangup', currentCallWithUser);
            if (peerConnection) { peerConnection.close(); peerConnection = null; }
            if (localStream) { localStream.getTracks().forEach(track => track.stop()); localStream = null; }
            document.getElementById('local-video').srcObject = null;
            document.getElementById('remote-video').srcObject = null;
            document.getElementById('call-overlay').style.display = "none";
            currentCallWithUser = null;
        }

        document.getElementById('hangup-call-btn').addEventListener('click', endCall);

        function sendSignal(type, targetUser, extraData = {}) {
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ type: type, targetUser: targetUser, sender: currentUsername, ...extraData }));
            }
        }
	}
</script>
